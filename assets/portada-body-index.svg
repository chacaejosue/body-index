<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 666" width="2000" height="666" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">BodyIndex — Calculadora Metabólica &amp; Composición Corporal</title>
  <desc id="bannerDesc">Portada de BodyIndex con isotipo simétrico espectral, diseño minimalista en modo oscuro y fundamentos científicos en Python y Next.js.</desc>

  <defs>
    <!-- Fondo oscuro moderno (Obsidiana / Carbono) -->
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Resplandor ambiental esmeralda (salud y vitalidad) -->
    <radialGradient id="emeraldGlow" cx="24%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#047857" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Resplandor ambiental ámbar (metabolismo y energía) -->
    <radialGradient id="amberGlow" cx="82%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente espectral del nuevo logo simétrico -->
    <linearGradient id="logoArchGrad" x1="10%" y1="65%" x2="90%" y2="65%">
      <stop offset="0%" stop-color="#00a86b" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="48%" stop-color="#84cc16" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="88%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Gradiente de la silueta humana -->
    <linearGradient id="logoFigureGrad" x1="50%" y1="20%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0b726b" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="logoHeadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Gradiente para el texto principal de marca -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- Patrón geométrico sutil de cuadrícula biométrica -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.8" opacity="0.35" />
      <circle cx="0" cy="0" r="1.2" fill="#3f3f46" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Fondo base con esquinas redondeadas -->
  <rect width="2000" height="666" rx="28" fill="url(#coverBg)" />
  <rect width="2000" height="666" rx="28" fill="url(#gridPattern)" />
  <rect width="2000" height="666" rx="28" fill="url(#emeraldGlow)" />
  <rect width="2000" height="666" rx="28" fill="url(#amberGlow)" />
  <rect width="1996" height="662" x="2" y="2" rx="26" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.8" />

  <!-- Líneas biométricas decorativas de fondo -->
  <g fill="none" opacity="0.2">
    <path d="M 120 540 C 350 480 420 590 620 520" stroke="#10b981" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M 1400 120 C 1600 160 1720 80 1900 130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Contenedor del Isotipo Oficial Simétrico -->
  <g transform="translate(160, 95) scale(0.475)">
    <!-- Aura sutil del logo -->
    <circle cx="500" cy="500" r="420" fill="#10b981" opacity="0.08" filter="blur(20px)" />

    <!-- Semicírculo envolvente 100% simétrico -->
    <path
      d="M 152 650 A 375 375 0 1 1 848 650"
      stroke="url(#logoArchGrad)"
      stroke-width="96"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Cabeza circular simétrica con respiro natural -->
    <circle cx="500" cy="395" r="80" fill="url(#logoHeadGrad)" />

    <!-- Silueta corporal orgánica y simétrica -->
    <path
      d="
        M 500 514
        C 472 514 380 456 284 411
        C 256 399 240 417 252 437
        C 260 450 274 466 294 476
        C 334 502 376 544 415 598
        C 428 622 436 652 448 698
        C 460 746 470 798 482 842
        C 488 858 512 858 518 842
        C 530 798 540 746 552 698
        C 564 652 572 622 585 598
        C 624 544 666 502 706 476
        C 726 466 740 450 748 437
        C 760 417 744 399 716 411
        C 620 456 528 514 500 514
        Z
      "
      fill="url(#logoFigureGrad)"
    />
  </g>

  <!-- Separador vertical sutil -->
  <line x1="710" y1="140" x2="710" y2="526" stroke="#27272a" stroke-width="1.5" opacity="0.8" />

  <!-- Bloque Tipográfico de Marca y Metadatos -->
  <g transform="translate(770, 0)">
    <!-- Badge de estado / categoría -->
    <g transform="translate(0, 140)">
      <rect width="270" height="34" rx="17" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="20" cy="17" r="4.5" fill="#10b981" />
      <text x="36" y="22" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1">MOTOR CIENTÍFICO</text>
    </g>

    <!-- Nombre principal: BodyIndex -->
    <text x="0" y="260" fill="url(#textGrad)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">BodyIndex</text>

    <!-- Subtítulo descriptivo -->
    <text x="0" y="325" fill="#e4e4e7" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="500" letter-spacing="-0.3">
      Calculadora Metabólica &amp; Composición Corporal
    </text>

    <text x="0" y="365" fill="#a1a1aa" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">
      Estimaciones de IMC, TMB, GET y macronutrientes basadas en consensos OMS, Oxford e ISSN.
    </text>

    <!-- Píldoras de Metodologías Científicas -->
    <g transform="translate(0, 425)">
      <!-- Pill 1: Katch-McArdle & Mifflin -->
      <g transform="translate(0, 0)">
        <rect width="240" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="22" cy="21" r="4" fill="#f59e0b" />
        <text x="36" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="13" font-weight="600">TMB Basal (Mifflin/Katch)</text>
      </g>

      <!-- Pill 2: Nuevo IMC Oxford -->
      <g transform="translate(255, 0)">
        <rect width="200" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="22" cy="21" r="4" fill="#10b981" />
        <text x="36" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="13" font-weight="600">Nuevo IMC Oxford</text>
      </g>

      <!-- Pill 3: Macros ISSN -->
      <g transform="translate(470, 0)">
        <rect width="210" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="22" cy="21" r="4" fill="#06b6d4" />
        <text x="36" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="13" font-weight="600">Macronutrientes ISSN</text>
      </g>

      <!-- Pill 4: Stack Python & Next.js -->
      <g transform="translate(695, 0)">
        <rect width="200" height="42" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="22" cy="21" r="4" fill="#8b5cf6" />
        <text x="36" y="26" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="13" font-weight="600">Python + Next.js</text>
      </g>
    </g>

    <!-- Línea de garantía técnica al pie -->
    <text x="0" y="525" fill="#71717a" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.5">
      100% CÁLCULO LOCAL • PRIVACIDAD GARANTIZADA • LICENCIA MIT • SIN ANUNCIOS
    </text>
  </g>
</svg>
